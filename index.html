<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق الحصون الخمسة | المساعد الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --primary-light: #ecfdf5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 16px 12px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; }

        header { text-align: center; margin-bottom: 16px; }
        header h1 { font-family: 'Amiri', serif; color: var(--primary-dark); font-size: 2rem; margin-bottom: 2px; }
        header p { font-size: 0.85rem; color: var(--text-muted); }

        .progress-card {
            background: var(--card-bg); padding: 14px 16px; border-radius: var(--radius);
            box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--border);
        }
        .progress-header { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; color: var(--primary-dark); }
        .progress-bar-bg { width: 100%; height: 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .input-group { background: var(--card-bg); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; padding: 8px; border: 1.5px solid var(--border); border-radius: 8px; font-weight: 700; font-size: 0.95rem; outline: none; background: #fff; }

        .btn-report { width: 100%; background: #1e293b; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .task-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .task-card {
            background: var(--card-bg); border-radius: var(--radius); padding: 14px;
            border: 1px solid var(--border); box-shadow: var(--shadow);
            display: flex; gap: 12px; align-items: flex-start; transition: all 0.2s ease;
        }
        .task-card.completed { background: #f1f5f9; opacity: 0.65; border-color: var(--primary); }

        .checkbox-wrapper { margin-top: 2px; }
        .checkbox-wrapper input {
            appearance: none; width: 26px; height: 26px; border: 2px solid #cbd5e1;
            border-radius: 50%; cursor: pointer; display: grid; place-content: center; background: #fff;
        }
        .checkbox-wrapper input:checked { background: var(--primary); border-color: var(--primary); }
        .checkbox-wrapper input:checked::before { content: '✔'; color: white; font-weight: bold; font-size: 13px; }

        .task-content { flex: 1; min-width: 0; }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .task-title { font-weight: 700; font-size: 0.95rem; color: var(--primary-dark); }
        .task-time { font-size: 0.75rem; background: var(--primary-light); color: var(--primary-dark); padding: 2px 8px; border-radius: 12px; font-weight: 700; white-space: nowrap; }
        .task-pages { font-size: 0.9rem; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
        .task-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 8px; }

        .quran-btn {
            display: inline-flex; align-items: center; gap: 4px; background: #f8fafc; color: var(--text-main);
            text-decoration: none; font-size: 0.8rem; font-weight: 700;
            padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
        }
        .quran-btn:active { background: var(--primary); color: white; }

        .btn-next { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(5, 150, 105, 0.25); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; place-items: center; z-index: 100; padding: 16px; }
        .modal-overlay.active { display: grid; }
        .modal-card { background: white; width: 100%; max-width: 380px; border-radius: 20px; padding: 22px; text-align: center; }
        .stat-circle { width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; font-size: 1.3rem; font-weight: bold; color: var(--primary-dark); }
        .stat-circle span { background: white; width: 85px; height: 85px; border-radius: 50%; display: grid; place-items: center; }
        .stat-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-box { background: var(--bg); padding: 10px; border-radius: 10px; border: 1px solid var(--border); }
        .stat-box strong { display: block; font-size: 1.15rem; color: var(--text-main); margin-top: 2px; }
        .btn-close { width: 100%; background: #e2e8f0; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; color: var(--text-main); }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>الحصون الخمسة</h1>
        <p>الورد اليومي المنظم حسب القواعد النبوية</p>
    </header>

    <div class="progress-card">
        <div class="progress-header">
            <span>إنجاز ورد اليوم</span>
            <span id="progressText">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="controls">
        <div class="input-group">
            <label>صفحة الحفظ اليوم:</label>
            <input type="number" id="currentPage" value="5" min="3" max="604">
        </div>
        <div class="input-group">
            <label>اليوم الحالي:</label>
            <select id="currentDay">
                <option value="0">السبت</option><option value="1">الأحد</option><option value="2">الإثنين</option>
                <option value="3">الثلاثاء</option><option value="4">الأربعاء</option><option value="5">الخميس</option><option value="6">الجمعة</option>
            </select>
        </div>
    </div>

    <button class="btn-report" onclick="openReport()">📊 عرض تقرير التقدم في القرآن</button>

    <div class="task-list" id="tasksList"></div>

    <button class="btn-next" onclick="nextDay()">✨ أتممت اليوم وانتقل للغد ←</button>
</div>

<!-- شاشة التقرير -->
<div class="modal-overlay" id="reportModal">
    <div class="modal-card">
        <h3 style="margin-bottom: 12px; font-family: 'Amiri', serif; font-size: 1.4rem;">رحلتك مع القرآن</h3>
        <div class="stat-circle" id="reportCircle">
            <span id="reportPercent">0%</span>
        </div>
        <div class="stat-details">
            <div class="stat-box">
                <small style="color:var(--text-muted); font-size:0.75rem;">المحفوظ</small>
                <strong id="repCompleted">0</strong> <span style="font-size:0.75rem;">صفحة</span>
            </div>
            <div class="stat-box">
                <small style="color:var(--text-muted); font-size:0.75rem;">المتبقي</small>
                <strong id="repRemaining">0</strong> <span style="font-size:0.75rem;">صفحة</span>
            </div>
        </div>
        <button class="btn-close" onclick="closeReport()">إغلاق</button>
    </div>
</div>

<script>
    const daysMap = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];

    function generateTasks(P, dayIndex) {
        let tasks = [];

        tasks.push({
            order: 1,
            title: "الحصن الأول: القراءة المستمرة",
            time: "40 د",
            pagesText: "جزأين من المصحف (حدر)",
            desc: "ورد التلاوة والتثبيت العام لختمة نصف شهرية.",
            quranLink: null
        });

        tasks.push({
            order: 2,
            title: "الحصن الثاني: التحضير الأسبوعي",
            time: "10 د",
            pagesText: `قراءة الصفحات ${3 + (Math.floor((P - 3) / 7) + 1) * 7} إلى ${3 + (Math.floor((P - 3) / 7) + 1) * 7 + 6}`,
            desc: "قراءة سريعة لصفحات الأسبوع القادم بواقع مرة واحدة.",
            quranLink: 3 + (Math.floor((P - 3) / 7) + 1) * 7
        });

        tasks.push({
            order: 3,
            title: "الحصن الثاني: التحضير الليلي",
            time: "15 د",
            pagesText: `صفحة الغد (صـ ${P + 1})`,
            desc: "سماع وقراءة متكررة قبل النوم بتركيز.",
            quranLink: P + 1
        });

        tasks.push({
            order: 4,
            title: "الحصن الثاني: التحضير القبلي",
            time: "15 د",
            pagesText: `صفحة اليوم (صـ ${P})`,
            desc: "قراءة حدر 15 مرة قبل الحفظ مباشرة.",
            quranLink: P
        });

        let distantPool = P > 23 ? (P - 20) - 3 : 0;
        if (distantPool > 0) {
            const tubeStart = 3 + (dayIndex * 40);
            const availableForThisDay = distantPool - (dayIndex * 40);
            if (availableForThisDay > 0) {
                const pagesToday = Math.min(40, availableForThisDay);
                tasks.push({
                    order: 5,
                    title: `الحصن الثالث: مراجعة البعيد`,
                    time: `${pagesToday} د`,
                    pagesText: `صـ ${tubeStart} إلى ${tubeStart + pagesToday - 1} (${pagesToday} ص)`,
                    desc: `أنبوبة يوم ${daysMap[dayIndex]} لمراجعة المحفوظ القديم.`,
                    quranLink: tubeStart
                });
            }
        }

        if (P > 3) {
            const startNear = Math.max(3, P - 20);
            const endNear = P - 1;
            const count = endNear - startNear + 1;
            tasks.push({
                order: 6,
                title: "الحصن الرابع: مراجعة القريب",
                time: `${count} د`,
                pagesText: `صـ ${startNear} إلى ${endNear} (${count} ص)`,
                desc: "مراجعة الصفحات العشرين الملاصقة لليوم.",
                quranLink: startNear
            });
        }

        tasks.push({
            order: 7,
            title: "الحصن الخامس: الحفظ الجديد",
            time: "15 د",
            pagesText: `صفحة رقم ${P}`,
            desc: "حفظ متقن للصفحة المحددة اليوم.",
            quranLink: P
        });

        return tasks.sort((a, b) => a.order - b.order);
    }

    function renderTasks() {
        const P = parseInt(document.getElementById('currentPage').value) || 3;
        const D = parseInt(document.getElementById('currentDay').value);
        const container = document.getElementById('tasksList');
        container.innerHTML = '';

        const tasks = generateTasks(P, D);

        tasks.forEach(task => {
            let quranBtnHtml = task.quranLink ? 
                `<a href="https://quran.com/page/${task.quranLink}" target="_blank" rel="noopener" class="quran-btn">📖 فتح صـ ${task.quranLink} بالمصحف</a>` : 
                '';

            const card = document.createElement('div');
            card.className = 'task-card';
            card.innerHTML = `
                <div class="checkbox-wrapper">
                    <input type="checkbox" onchange="updateProgress()">
                </div>
                <div class="task-content">
                    <div class="task-header">
                        <span class="task-title">${task.title}</span>
                        <span class="task-time">${task.time}</span>
                    </div>
                    <div class="task-pages">${task.pagesText}</div>
                    <div class="task-desc">${task.desc}</div>
                    ${quranBtnHtml}
                </div>
            `;
            container.appendChild(card);
        });
        updateProgress();
    }

    function updateProgress() {
        const checkboxes = document.querySelectorAll('.task-card input[type="checkbox"]');
        const cards = document.querySelectorAll('.task-card');
        
        let checked = 0;
        checkboxes.forEach((cb, index) => {
            if (cb.checked) {
                checked++;
                cards[index].classList.add('completed');
            } else {
                cards[index].classList.remove('completed');
            }
        });

        const percent = checkboxes.length ? Math.round((checked / checkboxes.length) * 100) : 0;
        document.getElementById('progressBar').style.width = `${percent}%`;
        document.getElementById('progressText').innerText = `${percent}%`;
    }

    function nextDay() {
        let pInput = document.getElementById('currentPage');
        let dInput = document.getElementById('currentDay');
        pInput.value = parseInt(pInput.value) + 1;
        dInput.value = (parseInt(dInput.value) + 1) % 7;
        renderTasks();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openReport() {
        const P = parseInt(document.getElementById('currentPage').value) || 3;
        const totalQuranPages = 602;
        let completed = Math.max(0, P - 3);
        let remaining = totalQuranPages - completed;
        let percent = ((completed / totalQuranPages) * 100).toFixed(1);

        document.getElementById('repCompleted').innerText = completed;
        document.getElementById('repRemaining').innerText = remaining;
        document.getElementById('reportPercent').innerText = `${percent}%`;
        document.getElementById('reportCircle').style.background = `conic-gradient(var(--primary) ${percent}%, var(--border) 0%)`;
        
        document.getElementById('reportModal').classList.add('active');
    }

    function closeReport() {
        document.getElementById('reportModal').classList.remove('active');
    }

    document.getElementById('currentPage').addEventListener('input', renderTasks);
    document.getElementById('currentDay').addEventListener('change', renderTasks);

    renderTasks();
</script>
</body>
</html>
