<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الحصون الخمسة لحفظ القرآن</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #15803d;
            --primary-dark: #166534;
            --secondary: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-family: 'Amiri', serif;
            color: var(--primary-dark);
            font-size: 2.2rem;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .inputs-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        input, select {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            background-color: #fff;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.15);
        }

        .stats-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #166534, #15803d);
            color: #fff;
            padding: 15px 20px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .stats-banner span {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .stats-banner strong {
            font-size: 1.4rem;
            display: block;
        }

        .fortresses {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .fortress-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .fortress-card::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background-color: var(--primary);
        }

        .fortress-card.highlight::before {
            background-color: var(--secondary);
        }

        .checkbox-container {
            margin-top: 3px;
        }

        .task-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .task-checkbox:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .task-checkbox:checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .card-content {
            flex-grow: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .card-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .card-time {
            font-size: 0.75rem;
            background: #f1f5f9;
            padding: 3px 8px;
            border-radius: 20px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #475569;
            line-height: 1.5;
        }

        .badge-pages {
            display: inline-block;
            background-color: #ecfdf5;
            color: var(--primary-dark);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            border: 1px solid #bbf7d0;
            margin-top: 4px;
        }

        .advance-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 4px 10px rgba(21, 128, 61, 0.25);
            transition: all 0.2s;
        }

        .advance-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>الحصون الخمسة</h1>
        <p>دليلك اليومي لتنفيذ منظومة الإتقان دون تشتت</p>
    </header>

    <div class="inputs-card">
        <div class="input-group">
            <label for="currentPage">رقم صفحة حفظ اليوم:</label>
            <input type="number" id="currentPage" value="5" min="3" max="604">
        </div>
        <div class="input-group">
            <label for="currentDay">اليوم الحالي:</label>
            <select id="currentDay">
                <option value="0">السبت</option>
                <option value="1">الأحد</option>
                <option value="2">الإثنين</option>
                <option value="3">الثلاثاء</option>
                <option value="4">الأربعاء</option>
                <option value="5">الخميس</option>
                <option value="6">الجمعة</option>
            </select>
        </div>
    </div>

    <div class="stats-banner">
        <div>
            <span>إجمالي الوقت التقديري</span>
            <strong id="totalTime">109 دقيقة</strong>
        </div>
        <div style="text-align: left;">
            <span>معدل الحفظ</span>
            <strong>صفحة يومياً</strong>
        </div>
    </div>

    <div class="fortresses" id="tasksList"></div>

    <button class="advance-btn" onclick="nextDay()">أتممت ورد اليوم وانتقل للغد ←</button>
</div>

<script>
    const daysMap = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];

    function calculatePlan(P, dayIndex) {
        let totalMinutes = 0;

        // 1. الحفظ الجديد (صـ P)
        const newMemorization = {
            title: "الحصن الخامس: الحفظ الجديد",
            time: 15,
            pagesText: `صفحة رقم ${P}`,
            desc: "حفظ متقن للصفحة المحددة باستخدام أركان الحفظ وتجنب التشتت.",
            highlight: true
        };
        totalMinutes += 15;

        // 2. التحضير القبلي (صـ P)
        const prepImmediate = {
            title: "الحصن الثاني: التحضير القبلي",
            time: 15,
            pagesText: `صفحة رقم ${P}`,
            desc: "قراءة حدر متكررة للصفحة قبل الحفظ مباشرة لمدة 15 دقيقة (حوالي 15 مرة)."
        };
        totalMinutes += 15;

        // 3. التحضير الليلي (صـ P + 1)
        const prepNight = {
            title: "الحصن الثاني: التحضير الليلي (قبل النوم)",
            time: 25,
            pagesText: `صفحة رقم ${P + 1}`,
            desc: "استماع وتكرار صفحة الغد بتركيز مع المنشاوي (15 دقيقة قراءة وترتيل + 10 دقائق سماع)."
        };
        totalMinutes += 25;

        // 4. التحضير الأسبوعي
        const weekIndex = Math.floor((P - 3) / 7);
        const nextWeekStart = 3 + (weekIndex + 1) * 7;
        const nextWeekEnd = nextWeekStart + 6;
        const prepWeekly = {
            title: "الحصن الثاني: التحضير الأسبوعي",
            time: 10,
            pagesText: `الصفحات من ${nextWeekStart} إلى ${nextWeekEnd} (7 صفحات)`,
            desc: "قراءة سريعة لصفحات الأسبوع القادم بواقع مرة واحدة يومياً."
        };
        totalMinutes += 10;

        // 5. مراجعة القريب (آخر 20 صفحة ملاصقة)
        let nearRevision = null;
        if (P > 3) {
            const startNear = Math.max(3, P - 20);
            const endNear = P - 1;
            const count = endNear - startNear + 1;
            nearRevision = {
                title: "الحصن الرابع: مراجعة القريب",
                time: count,
                pagesText: `الصفحات من ${startNear} إلى ${endNear} (${count} صفحة)`,
                desc: "مراجعة يومية حدر للصفحات الملاصقة للجديد لتثبيتها في الذاكرة القريبة."
            };
            totalMinutes += count;
        }

        // 6. مراجعة البعيد (الأنابيب)
        let distantRevision = null;
        let distantPool = 0;
        if (P > 23) {
            distantPool = (P - 20) - 3;
        }

        if (distantPool > 0) {
            const tubeCapacity = 40;
            const tubeStart = 3 + (dayIndex * tubeCapacity);
            const availableForThisDay = distantPool - (dayIndex * tubeCapacity);

            if (availableForThisDay > 0) {
                const pagesToday = Math.min(tubeCapacity, availableForThisDay);
                distantRevision = {
                    title: `الحصن الثالث: مراجعة البعيد (أنبوبة ${daysMap[dayIndex]})`,
                    time: pagesToday,
                    pagesText: `الصفحات من ${tubeStart} إلى ${tubeStart + pagesToday - 1} (${pagesToday} صفحة)`,
                    desc: "مراجعة الصفحات القديمة المستقرة بطريقة الحدر (تكتمل حتى جزأين كحد أقصى للأنبوبة)."
                };
                totalMinutes += pagesToday;
            }
        }

        // 7. القراءة المستمرة
        const continuousReading = {
            title: "الحصن الأول: القراءة المستمرة والختم",
            time: 40,
            pagesText: "جزأين يومياً (ختمة نصف شهرية)",
            desc: "ورد التلاوة والتثبيت العام من المصحف حدر (أو جزء كحد أدنى) مع سماع حزب."
        };
        totalMinutes += 40;

        return {
            totalMinutes,
            tasks: [
                prepImmediate,
                newMemorization,
                nearRevision,
                distantRevision,
                prepNight,
                prepWeekly,
                continuousReading
            ].filter(Boolean)
        };
    }

    function render() {
        const pInput = parseInt(document.getElementById('currentPage').value) || 3;
        const dInput = parseInt(document.getElementById('currentDay').value);

        const plan = calculatePlan(pInput, dInput);
        document.getElementById('totalTime').innerText = `${plan.totalMinutes} دقيقة`;

        const container = document.getElementById('tasksList');
        container.innerHTML = '';

        plan.tasks.forEach(task => {
            const card = document.createElement('div');
            card.className = `fortress-card ${task.highlight ? 'highlight' : ''}`;
            card.innerHTML = `
                <div class="checkbox-container">
                    <input type="checkbox" class="task-checkbox">
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <span class="card-title">${task.title}</span>
                        <span class="card-time">${task.time} دقيقة</span>
                    </div>
                    <div class="badge-pages">${task.pagesText}</div>
                    <p class="card-desc" style="margin-top: 6px;">${task.desc}</p>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function nextDay() {
        let pInput = document.getElementById('currentPage');
        let dInput = document.getElementById('currentDay');

        pInput.value = parseInt(pInput.value) + 1;
        dInput.value = (parseInt(dInput.value) + 1) % 7;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('currentPage').addEventListener('input', render);
    document.getElementById('currentDay').addEventListener('change', render);

    // التشغيل التلقائي عند التحميل
    render();
</script>
</body>
</html>
